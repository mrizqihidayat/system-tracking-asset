; Pengaturan PHP untuk container (T38).
; Batas file aset 4 MB ditegakkan Laravel (413 "Ukuran file maksimal 4 MB."); PHP diberi sedikit longgar
; supaya file 4-5 MB sampai ke Laravel dan mendapat pesan yang sama. Vercel sendiri membatasi body 4,5 MB.
upload_max_filesize = 5M
post_max_size = 6M
memory_limit = 256M
expose_php = Off
